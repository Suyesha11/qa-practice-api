name: API Tests

on: [push]

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install

      - name: Start API server
        run: npm start &

      - name: Wait for server to be ready
        run: sleep 3

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: newman run QA-Practice-API.postman_collection.json -e local.postman_environment.json -r cli,htmlextra --reporter-htmlextra-export newman-report.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
